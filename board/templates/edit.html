{% extends 'base.html' %}
{% block title %}글 수정{% endblock %}
{% block extra_head %}
<meta name="robots" content="noindex,nofollow">
{% endblock %}

{% block content %}
<div class="form-wrap">
  <h2>글 수정</h2>
  <form method="post" action="{{ url_for('edit', post_id=post['id']) }}">
    <div class="form-row">
      <label>제목</label>
      <input type="text" name="title" required maxlength="100" value="{{ post['title'] }}">
    </div>
    <div class="form-row">
      <label>내용</label>
      <textarea name="content" rows="12" required>{{ post['content'] }}</textarea>
    </div>
    <div class="form-row">
      <label>비밀번호 확인</label>
      <input type="password" name="password" required placeholder="등록 시 입력한 비밀번호" style="max-width:240px;">
    </div>
    <div class="form-footer">
      <a href="{{ url_for('view', post_id=post['id']) }}" class="btn btn-gray">취소</a>
      <button type="submit" class="btn btn-primary">수정 완료</button>
    </div>
  </form>
</div>
{% endblock %}

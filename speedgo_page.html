	$(document).ready(function(){
		// 19금 상품 로그인 처리
		if("" == 1)

		{
			$("#lLoginFromWrap input[name=id]").focus();
		}

		// 허용된 글자 외의 입력은 제거
		var idConf	= /[^0-9a-z\_\-\@]/gi;

		$("#lLoginFromWrap input[name=id]").on("focusout", function() {
			var x		= $(this).val();

			if(x.length > 0)
			{
				if(idConf.test(x))
				{
					x	= x.replace(idConf, '');
				}

				$(this).val();
			}
		}).on("keyup", function() {
			$(this).val($(this).val().replace(idConf, ''));
		});

		//cfmPwd가 뜨는 경우
		if("" == '1')
		{
			$("#alertMsg").show();
			$("#alertMsg").html('회원님이 설정하지 않은 로그인환경에서 로그인이 시도되었습니다');
		}

	});

		setFooterPosition();

	var isSubmitting = false;	// 로그인진행중 여부

	function chkLogin(obj)
	{
		if(isSubmitting)
		{
			return false;
		}

		var orgBtnText = $(".formSubmit").val();   // 기존 텍스트 저장

		isSubmitting	= true;
		$(".formSubmit").addClass('lSubmitting');
		$(".formSubmit").val("로그인 중");           // 버튼 텍스트 변경

		try
		{
			if($("#lLoginFromWrap input[name=id]").val().length == 0)
			{
				$("#lLoginFromWrap input[name=id]").focus();
				throw('아이디를 입력해주세요');
			}

			var idCheck	= /^[0-9a-z\_\-\@]+$/;

			if(!idCheck.test($("#lLoginFromWrap input[name=id]").val()))
			{
				$("#lLoginFromWrap input[name=id]").focus();
				throw('회원아이디는 4~20자이내의 영문 또는 숫자로 이루어져야 합니다');
			}

			if($("#lLoginFromWrap input[name=pass]").val().length == 0)
			{
				$("#lLoginFromWrap input[name=pass]").focus();
				throw('비밀번호를 입력해주세요');
			}

			// 캡챠입력 유효성 검사
			if('false' == 'true')
			{
				if($("#lLoginFromWrap input[name=keystring]").val().length == 0)
				{
					$("#lLoginFromWrap input[name=keystring]").focus();
					throw('자동입력 방지문자를 입력해주세요');
				}
			}

			var timer = setTimeout(function()
			{
				$(".formSubmit").val(orgBtnText);
				$(".formSubmit").removeClass('lSubmitting');
				isSubmitting = false;
			}, 2000);
		}
		catch(e)
		{
			$("#alertMsg").show();
			$("#alertMsg").html(e);

			var timer = setTimeout(function()
			{
				$(".formSubmit").val(orgBtnText);
				$(".formSubmit").removeClass('lSubmitting');
				isSubmitting = false;
			}, 500);

			return false;
		}

		return true;
	}

	// 캡챠기능
	if('false' == 'true')

		});
	}

	function captchaReplace()
	{
		var imageSrc = 'http://domeggook.com/tool/kcaptcha/index.php';
		var captchaImage = document.getElementById('captchaImage');
		captchaImage.src = imageSrc+"?t="+mktime();
	}

	function mktime()
	{
		var d = new Date(),
		r = arguments,
		i = 0,
		e = ['Hours', 'Minutes', 'Seconds', 'Month', 'Date', 'FullYear'];

		for (i = 0; i < e.length; i++)
		{
			if (typeof r[i] === 'undefined')
			{
				r[i] = d['get' + e[i]]();
				r[i] += (i === 3);
			}
			else
			{
				r[i] = parseInt(r[i], 10);
				if (isNaN(r[i]))
				{
					return false;
				}
			}
		}
		r[5] += (r[5] >= 0 ? (r[5] <= 69 ? 2e3 : (r[5] <= 100 ? 1900 : 0)) : 0);
		d.setFullYear(r[5], r[3] - 1, r[4]);

		d.setHours(r[0], r[1], r[2]);

		return (d.getTime() / 1e3 >> 0) - (d.getTime() < 0);
	}
